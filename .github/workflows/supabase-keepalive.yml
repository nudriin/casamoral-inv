name: Supabase Keepalive (Casa Moral)

on:
  schedule:
    # Berjalan otomatis setiap 5 hari sekali pukul 00:00 UTC (07:00 WIB)
    - cron: "0 0 */5 * *"
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Supabase Auth & PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run Supabase Keepalive Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-keepalive.js
